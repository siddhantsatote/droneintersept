<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drone Detector</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            touch-action: none;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .badge {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 16px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffa500;
            animation: pulse 1.5s infinite;
        }

        #status-dot.ready {
            background: #00ff00;
            animation: none;
        }

        #status-dot.detecting {
            background: #00ff00;
            animation: pulse 0.3s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        #fps-counter {
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 13px;
        }

        #bottom-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .btn {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 14px 24px;
            border-radius: 28px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.25);
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        #detection-badge {
            background: rgba(37, 99, 235, 0.9);
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 700;
            display: none;
        }

        #detection-badge.visible {
            display: flex;
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0f0f1a 0%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 32px;
            text-align: center;
        }

        #loading-overlay.hidden {
            display: none;
        }

        .loader {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loading-text {
            font-size: 18px;
            font-weight: 500;
            color: #888;
            margin-bottom: 8px;
        }

        #loading-sub {
            font-size: 14px;
            color: #555;
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }

        #error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            text-align: center;
            z-index: 100;
        }

        #error-overlay.visible {
            display: flex;
        }

        #error-icon {
            font-size: 56px;
            margin-bottom: 20px;
        }

        #error-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        #error-message {
            font-size: 15px;
            color: #888;
            max-width: 320px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        #retry-btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 14px 36px;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        #mode-badge {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>

        <div id="ui-overlay">
            <div id="top-bar">
                <div class="badge">
                    <div id="status-dot"></div>
                    <span id="status-text">Loading</span>
                </div>
                <div class="badge" id="fps-counter">-- FPS</div>
            </div>

            <div id="bottom-bar">
                <button class="btn" id="switch-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 3h5v5M8 21H3v-5M21 3l-7 7M3 21l7-7"/>
                    </svg>
                    Flip
                </button>
                <div class="badge" id="detection-badge">🛸 0 Detected</div>
            </div>
        </div>

        <div id="loading-overlay">
            <div class="logo">🛸</div>
            <div class="loader"></div>
            <div id="loading-text">Loading AI Model...</div>
            <div id="loading-sub">This may take a few seconds</div>
            <div id="mode-badge">Running locally in your browser</div>
        </div>

        <div id="error-overlay">
            <div id="error-icon">⚠️</div>
            <div id="error-title">Error</div>
            <div id="error-message"></div>
            <button id="retry-btn">Try Again</button>
        </div>
    </div>

    <script>
        const DETECTION_CLASSES = ['airplane', 'bird', 'kite'];
        const CONFIDENCE_THRESHOLD = 0.4;
        const BOX_COLORS = {
            airplane: '#00ff00',
            bird: '#ffff00', 
            kite: '#ff00ff',
            default: '#00ff00'
        };

        let model = null;
        let video, canvas, ctx;
        let currentFacing = 'environment';
        let isRunning = false;
        let frameCount = 0;
        let lastFpsTime = Date.now();
        let currentStream = null;

        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const fpsCounter = document.getElementById('fps-counter');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const errorOverlay = document.getElementById('error-overlay');
        const errorTitle = document.getElementById('error-title');
        const errorMessage = document.getElementById('error-message');
        const switchBtn = document.getElementById('switch-btn');
        const retryBtn = document.getElementById('retry-btn');
        const detectionBadge = document.getElementById('detection-badge');

        function setStatus(state, text) {
            statusDot.className = state;
            statusText.textContent = text;
        }

        function showError(title, message) {
            errorTitle.textContent = title;
            errorMessage.textContent = message;
            errorOverlay.classList.add('visible');
        }

        function hideError() {
            errorOverlay.classList.remove('visible');
        }

        function updateDetectionBadge(count) {
            if (count > 0) {
                detectionBadge.textContent = `🛸 ${count} Detected`;
                detectionBadge.classList.add('visible');
            } else {
                detectionBadge.classList.remove('visible');
            }
        }

        async function loadModel() {
            try {
                loadingText.textContent = 'Loading AI Model...';
                model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
                console.log('Model loaded');
                return true;
            } catch (err) {
                console.error('Model load error:', err);
                showError('Model Error', 'Failed to load AI model. Please check your connection and try again.');
                return false;
            }
        }

        async function setupCamera() {
            try {
                loadingText.textContent = 'Starting camera...';
                
                if (currentStream) {
                    currentStream.getTracks().forEach(t => t.stop());
                }

                const constraints = {
                    video: {
                        facingMode: currentFacing,
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        frameRate: { ideal: 60, min: 30 }
                    },
                    audio: false
                };

                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;

                return new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve(true);
                    };
                });
            } catch (err) {
                console.error('Camera error:', err);
                let msg = 'Could not access camera. ';
                if (err.name === 'NotAllowedError') {
                    msg += 'Please grant camera permission.';
                } else if (err.name === 'NotFoundError') {
                    msg += 'No camera found.';
                } else {
                    msg += err.message;
                }
                showError('Camera Error', msg);
                return false;
            }
        }

        async function switchCamera() {
            currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
            await setupCamera();
        }

        function drawDetections(predictions) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const relevant = predictions.filter(p => 
                DETECTION_CLASSES.includes(p.class) && p.score >= CONFIDENCE_THRESHOLD
            );

            relevant.forEach(pred => {
                const [x, y, width, height] = pred.bbox;
                const color = BOX_COLORS[pred.class] || BOX_COLORS.default;
                const label = `Drone ${Math.round(pred.score * 100)}%`;

                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, width, height);

                ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, sans-serif';
                const textWidth = ctx.measureText(label).width;
                const textHeight = 20;
                const padding = 6;

                ctx.fillStyle = color;
                ctx.fillRect(x, y - textHeight - padding, textWidth + padding * 2, textHeight + padding);

                ctx.fillStyle = '#000';
                ctx.fillText(label, x + padding, y - padding - 2);
            });

            updateDetectionBadge(relevant.length);
            return relevant.length;
        }

        async function detectFrame() {
            if (!isRunning || !model) return;

            try {
                const predictions = await model.detect(video);
                const detected = drawDetections(predictions);

                frameCount++;
                const now = Date.now();
                if (now - lastFpsTime >= 1000) {
                    fpsCounter.textContent = `${frameCount} FPS`;
                    frameCount = 0;
                    lastFpsTime = now;
                }

                setStatus(detected > 0 ? 'detecting' : 'ready', detected > 0 ? 'Detecting' : 'Scanning');
            } catch (err) {
                console.error('Detection error:', err);
            }

            requestAnimationFrame(detectFrame);
        }

        async function init() {
            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            hideError();
            loadingOverlay.classList.remove('hidden');

            const modelOk = await loadModel();
            if (!modelOk) {
                loadingOverlay.classList.add('hidden');
                return;
            }

            const camOk = await setupCamera();
            if (!camOk) {
                loadingOverlay.classList.add('hidden');
                return;
            }

            loadingOverlay.classList.add('hidden');
            setStatus('ready', 'Scanning');
            isRunning = true;
            detectFrame();
        }

        switchBtn.addEventListener('click', switchCamera);
        retryBtn.addEventListener('click', () => {
            hideError();
            init();
        });

        window.addEventListener('resize', () => {
            if (video && video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
