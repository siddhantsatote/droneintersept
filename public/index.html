<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drone Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }
        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #ui {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            padding: 16px;
            padding-top: max(16px, env(safe-area-inset-top));
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }
        .badge {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        #top { display: flex; justify-content: space-between; }
        #dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #888;
        }
        #dot.connecting { background: #ffa500; animation: pulse 1s infinite; }
        #dot.streaming { background: #0f0; }
        #dot.error { background: #f44; }
        @keyframes pulse { 50% { opacity: 0.4; } }
        #bottom { display: flex; justify-content: center; gap: 12px; }
        .btn {
            pointer-events: auto;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 14px 28px;
            border-radius: 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:active { transform: scale(0.95); }
        .btn.stop { background: rgba(255,50,50,0.8); }
        #start-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #111 0%, #000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
        }
        #start-screen.hidden { display: none; }
        #start-screen h1 { font-size: 28px; margin: 16px 0 8px; }
        #start-screen p { color: #888; margin-bottom: 32px; }
        .logo { font-size: 64px; }
        #error {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
        }
        #error.show { display: flex; }
        #error h2 { margin: 16px 0 8px; }
        #error p { color: #888; max-width: 300px; margin-bottom: 24px; }
    </style>
</head>
<body>
    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <div id="ui">
            <div id="top">
                <div class="badge"><div id="dot"></div><span id="status">Ready</span></div>
                <div class="badge" id="count" style="display:none">0 Drones</div>
            </div>
            <div id="bottom">
                <button class="btn stop" id="stopBtn" style="display:none">Stop</button>
            </div>
        </div>
        <div id="start-screen">
            <div class="logo">🛸</div>
            <h1>Drone Detector</h1>
            <p>Real-time AI drone detection powered by Roboflow</p>
            <button class="btn" id="startBtn">Start Detection</button>
        </div>
        <div id="error">
            <div class="logo">⚠️</div>
            <h2 id="errTitle">Error</h2>
            <p id="errMsg"></p>
            <button class="btn" id="retryBtn">Try Again</button>
        </div>
    </div>

    <script type="module">
        import { connectors, webrtc, streams } from 'https://cdn.jsdelivr.net/npm/@roboflow/inference-sdk@0.3.0/+esm';

        const CONFIG = {
            apiKey: 'qk5IRigWesBxqBBwEQ1L',
            serverUrl: 'https://serverless.roboflow.com',
            workspaceName: 'siddhantsatotes-workspace',
            workflowId: 'general-segmentation-api',
            streamOutputNames: ['annotated_image'],
            dataOutputNames: ['predictions'],
            requestedPlan: 'webrtc-gpu-medium',
            requestedRegion: 'us',
            classes: 'drone'
        };

        let connection = null;

        const video = document.getElementById('video');
        const dot = document.getElementById('dot');
        const status = document.getElementById('status');
        const count = document.getElementById('count');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const errorDiv = document.getElementById('error');
        const errTitle = document.getElementById('errTitle');
        const errMsg = document.getElementById('errMsg');
        const retryBtn = document.getElementById('retryBtn');

        function setStatus(state, text) {
            dot.className = state;
            status.textContent = text;
        }

        function showError(title, msg) {
            errTitle.textContent = title;
            errMsg.textContent = msg;
            errorDiv.classList.add('show');
        }

        function updateCount(n) {
            if (n > 0) {
                count.textContent = n + ' Drone' + (n > 1 ? 's' : '');
                count.style.display = 'flex';
            } else {
                count.style.display = 'none';
            }
        }

        async function start() {
            try {
                startBtn.disabled = true;
                startBtn.textContent = 'Connecting...';
                setStatus('connecting', 'Connecting');

                const connector = connectors.withApiKey(CONFIG.apiKey, { serverUrl: CONFIG.serverUrl });

                const stream = await streams.useCamera({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });

                connection = await webrtc.useStream({
                    source: stream,
                    connector,
                    wrtcParams: {
                        workspaceName: CONFIG.workspaceName,
                        workflowId: CONFIG.workflowId,
                        streamOutputNames: CONFIG.streamOutputNames,
                        dataOutputNames: CONFIG.dataOutputNames,
                        processingTimeout: 3600,
                        requestedPlan: CONFIG.requestedPlan,
                        requestedRegion: CONFIG.requestedRegion,
                        workflowsParameters: {
                            classes: CONFIG.classes
                        }
                    },
                    onData: (data) => {
                        if (data.predictions) updateCount(data.predictions.length);
                    },
                    onError: (err) => {
                        showError('Stream Error', err.message || 'Connection lost');
                        stop();
                    }
                });

                video.srcObject = await connection.remoteStream();
                startScreen.classList.add('hidden');
                stopBtn.style.display = 'block';
                setStatus('streaming', 'Detecting');

            } catch (err) {
                let msg = err.message;
                if (err.name === 'NotAllowedError') msg = 'Camera permission denied';
                showError('Connection Failed', msg);
                startBtn.disabled = false;
                startBtn.textContent = 'Start Detection';
            }
        }

        function stop() {
            connection?.cleanup();
            connection = null;
            video.srcObject = null;
            startScreen.classList.remove('hidden');
            stopBtn.style.display = 'none';
            errorDiv.classList.remove('show');
            startBtn.disabled = false;
            startBtn.textContent = 'Start Detection';
            setStatus('', 'Ready');
            updateCount(0);
        }

        startBtn.onclick = start;
        stopBtn.onclick = stop;
        retryBtn.onclick = () => { errorDiv.classList.remove('show'); start(); };
    </script>
</body>
</html>
